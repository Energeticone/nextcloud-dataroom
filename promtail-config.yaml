# Tails only the audit log. Positions live on a volume so a restart
# does not re-ship the whole file and double-count every open.

server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /var/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nextcloud-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: nextcloud
          __path__: /logs/audit.log
    pipeline_stages:
      - json:
          expressions:
            app: app
            user: user
      - template:
          source: user
          template: '{{ if .Value }}{{ .Value }}{{ else }}anonymous{{ end }}'
      - labels:
          app:
          user:
